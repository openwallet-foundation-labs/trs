name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:core
      - name: Lint
        working-directory: trs
        run: pnpm exec eslint "{apps,libs}/**/*.ts"
      - name: Format
        working-directory: trs
        run: pnpm exec prettier --check "{apps,libs}/**/*.ts"
      - name: Build
        working-directory: trs
        run: pnpm build
      - name: Test
        working-directory: trs
        run: pnpm test

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t trs-resolver:ci .
      - name: Smoke test
        run: |
          docker run -d --name trs -p 3000:3000 trs-resolver:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs trs
          exit 1
